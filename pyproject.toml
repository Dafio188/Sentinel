[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aigate"
version = "0.1.0"
description = "Local AI Privacy & Compliance Gateway"
readme = "docs/SPEC-ARCHITECTURE.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "keyring>=24.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
